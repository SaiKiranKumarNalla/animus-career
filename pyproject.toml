[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animus_career"
version = "1.0.0"
description = "Local-first AI career agent: knowledge graph, jobs, academia, research labs, GitHub coach and weekly briefs, powered by your own Claude / Codex / Gemini."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "httpx>=0.27",
  "pypdf>=4.0", "python-docx>=1.1", "anthropic>=1.0", "markdown>=3.5",
]
[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
animus-career = "animus_career.cli:main"
animus = "animus_career.cli:main"

[tool.setuptools]
packages = ["animus_career"]

[tool.setuptools.package-data]
animus_career = ["static/*", "web/*", "packs/*.json"]
