# Publishes the browser version (animus_career/web) to GitHub Pages: https://<you>.github.io/<repo>/
# Enable once in the repo: Settings → Pages → Source: GitHub Actions.
name: Web app
on:
  push:
    branches: [main]
    paths: ["animus_career/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: {path: animus_career/web}
      - id: deploy
        uses: actions/deploy-pages@v4
